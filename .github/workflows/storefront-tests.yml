name: Storefront tests (manual)

# Runs only when you press the button: Actions tab, then "Storefront tests (manual)", then "Run workflow".
# It never starts by itself, so it does not hit the live store on every push.
on:
  workflow_dispatch:
    inputs:
      project:
        description: Which tests to run
        type: choice
        default: all
        options:
          - all
          - desktop
          - mobile

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install packages
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run tests
        env:
          # Only needed while the store shows "Opening soon". Saved in the repo's Secrets, never in a file.
          STOREFRONT_PASSWORD: ${{ secrets.STOREFRONT_PASSWORD }}
          PROJECT: ${{ inputs.project }}
        run: |
          if [ "$PROJECT" = "all" ]; then
            npx playwright test
          else
            npx playwright test --project="$PROJECT"
          fi

      - name: Save the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
